name: NightVision
version: '1.4'
main: org.ayosynk.nightVision.NightVision
api-version: '1.21'
folia-supported: true
author: AyoSynk
description: Ultra-lightweight night vision toggle plugin supporting Folia, Paper, and modern forks.

commands:
  nightvision:
    description: Toggle night vision effect
    usage: /nightvision [reload]
    aliases: [nv]

permissions:
  nightvision.use:
    description: Allows players to use the night vision toggle command
    default: true
  nightvision.reload:
    description: Allows reloading the plugin configuration
    default: op
  nightvision.admin:
    description: Allows receiving update notifications when joining the server
    default: op